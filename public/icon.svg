<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#480ed8" />
      <stop offset="100%" stop-color="#180336" />
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A3D" />
      <stop offset="100%" stop-color="#FF5914" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#FF5914" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Container Box with Rounded Corners -->
  <rect width="512" height="512" rx="120" fill="url(#bg)" />
  
  <!-- Subtle Inner Border Accent -->
  <rect x="8" y="8" width="496" height="496" rx="112" fill="none" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="6" />

  <!-- Bold Rivreach "R" Brand Mark -->
  <path d="M 130,115 L 265,115 C 335,115 380,152 380,215 C 380,270 342,302 288,312 L 382,402 L 302,402 L 218,320 L 205,320 L 205,402 L 130,402 Z M 205,260 L 255,260 C 290,260 308,245 308,215 C 308,185 290,170 255,170 L 205,170 Z" fill="#FFFFFF" />

  <!-- Upward Growth Spark Arrow in Brand Orange -->
  <path d="M 330,105 L 412,105 L 412,187 L 372,147 L 305,214 L 275,184 L 342,117 Z" fill="url(#orangeGrad)" filter="url(#glow)" />
</svg>
