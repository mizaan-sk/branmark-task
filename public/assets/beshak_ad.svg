<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" width="300" height="400">
  <defs>
    <linearGradient id="beshakBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#042F2E"/>
      <stop offset="50%" stop-color="#0F766E"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="300" height="400" rx="16" fill="url(#beshakBg)"/>

  <!-- Top Badge -->
  <g transform="translate(20, 20)">
    <rect width="130" height="24" rx="12" fill="rgba(255,255,255,0.2)"/>
    <text x="65" y="16" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#5EEAD4" text-anchor="middle">INSURANCE ADVISORY</text>
  </g>
  <text x="280" y="36" font-family="system-ui, sans-serif" font-size="14" font-weight="900" fill="#FFFFFF" text-anchor="end">Beshak</text>

  <!-- Main Headline -->
  <text x="20" y="80" font-family="system-ui, sans-serif" font-weight="900" font-size="22" fill="#FFFFFF">
    <tspan x="20" dy="0">COMPARE &amp; PICK</tspan>
    <tspan x="20" dy="26" fill="#5EEAD4">THE BEST INSURANCE</tspan>
  </text>
  <text x="20" y="132" font-family="system-ui, sans-serif" font-size="11" fill="#CCFBF1">Unbiased Health &amp; Term Insurance Advice</text>

  <!-- Shield Icon & Content Box -->
  <g transform="translate(20, 150)">
    <rect width="260" height="150" rx="12" fill="rgba(15, 23, 42, 0.5)" stroke="#5EEAD4" stroke-width="1"/>
    
    <!-- Shield Graphic -->
    <path d="M 130 20 C 160 20 170 30 170 55 C 170 85 145 100 130 105 C 115 100 90 85 90 55 C 90 30 100 20 130 20 Z" fill="#0D9488" opacity="0.8"/>
    <path d="M 118 55 L 126 63 L 142 47" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none"/>

    <text x="130" y="125" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle">100% Zero-Conflict Recommendations</text>
  </g>

  <!-- CTA Button -->
  <g transform="translate(20, 320)">
    <rect width="260" height="44" rx="22" fill="#14B8A6"/>
    <text x="130" y="27" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#042F2E" text-anchor="middle">Get Free Consultation →</text>
  </g>

  <!-- Bottom Subtext -->
  <text x="150" y="386" font-family="system-ui, sans-serif" font-size="9" fill="#CCFBF1" text-anchor="middle">1476 High-Intent Leads • Meta &amp; Google Ads</text>
</svg>
