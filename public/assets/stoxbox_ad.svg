<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" width="300" height="400">
  <defs>
    <linearGradient id="stoxGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="50%" stop-color="#311B92"/>
      <stop offset="100%" stop-color="#4C1D95"/>
    </linearGradient>
    <linearGradient id="chartGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22C55E" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#22C55E" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect width="300" height="400" rx="16" fill="url(#stoxGradient)"/>
  
  <!-- Header Bar -->
  <g transform="translate(16, 16)">
    <rect width="110" height="24" rx="12" fill="rgba(255,255,255,0.15)"/>
    <text x="55" y="16" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#22C55E" text-anchor="middle">✓ SEBI REGISTERED</text>
  </g>
  <text x="284" y="30" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#A78BFA" text-anchor="end">STOXBOX</text>

  <!-- Headline -->
  <text x="20" y="80" font-family="system-ui, sans-serif" font-weight="900" font-size="22" fill="#FFFFFF" width="260">
    <tspan x="20" dy="0">BUY STOCKS AT</tspan>
    <tspan x="20" dy="26" fill="#FACC15">THE RIGHT TIME!</tspan>
  </text>
  <text x="20" y="132" font-family="system-ui, sans-serif" font-size="11" fill="#C4B5FD">Get AI-Powered Insights Right On WhatsApp</text>

  <!-- Chart Graphic Box -->
  <g transform="translate(20, 150)">
    <rect width="260" height="150" rx="12" fill="rgba(15, 23, 42, 0.6)" stroke="rgba(167, 139, 250, 0.3)"/>
    <path d="M 10 110 Q 50 90, 80 100 T 150 50 T 210 60 T 250 20 L 250 130 L 10 130 Z" fill="url(#chartGrad)"/>
    <path d="M 10 110 Q 50 90, 80 100 T 150 50 T 210 60 T 250 20" fill="none" stroke="#22C55E" stroke-width="3"/>
    
    <circle cx="250" cy="20" r="5" fill="#22C55E"/>
    <rect x="180" y="12" width="60" height="20" rx="4" fill="#22C55E"/>
    <text x="210" y="26" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#FFFFFF" text-anchor="middle">+148.5%</text>

    <text x="15" y="30" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">NIFTY50 Signal</text>
    <text x="15" y="45" font-family="system-ui, sans-serif" font-size="9" fill="#94A3B8">STRONG BUY • ACCUMULATE</text>
  </g>

  <!-- CTA Button -->
  <g transform="translate(20, 320)">
    <rect width="260" height="44" rx="22" fill="#FF5914"/>
    <text x="130" y="27" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="middle">Open Free Demat Account →</text>
  </g>

  <!-- Bottom Tag -->
  <text x="150" y="386" font-family="system-ui, sans-serif" font-size="9" fill="#94A3B8" text-anchor="middle">Stop guessing the market. Start investing smarter.</text>
</svg>
