<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" width="300" height="400">
  <defs>
    <linearGradient id="paramountBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="60%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="300" height="400" rx="16" fill="url(#paramountBg)"/>
  
  <!-- Architectural Silhouette -->
  <g fill="#1E293B" opacity="0.8">
    <rect x="20" y="160" width="50" height="180" rx="4"/>
    <rect x="80" y="120" width="65" height="220" rx="4"/>
    <rect x="155" y="90" width="70" height="250" rx="4"/>
    <rect x="235" y="140" width="45" height="200" rx="4"/>
  </g>
  <g fill="#F59E0B" opacity="0.3">
    <circle cx="120" cy="160" r="2"/>
    <circle cx="180" cy="140" r="2"/>
    <circle cx="190" cy="180" r="2"/>
    <circle cx="100" cy="200" r="2"/>
  </g>

  <!-- Top Badge -->
  <g transform="translate(20, 20)">
    <rect width="140" height="24" rx="6" fill="url(#goldGrad)"/>
    <text x="70" y="16" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#0F172A" text-anchor="middle">EXCLUSIVE REAL ESTATE</text>
  </g>

  <!-- Headline -->
  <text x="20" y="80" font-family="system-ui, sans-serif" font-weight="900" font-size="22" fill="#FFFFFF">
    <tspan x="20" dy="0">LUXURY RESIDENCES</tspan>
    <tspan x="20" dy="26" fill="#F59E0B">&amp; PREMIUM APARTMENTS</tspan>
  </text>
  <text x="20" y="132" font-family="system-ui, sans-serif" font-size="11" fill="#94A3B8">High ROI Properties • Prime Locations</text>

  <!-- Features Overlay Box -->
  <g transform="translate(20, 160)">
    <rect width="260" height="140" rx="12" fill="rgba(15, 23, 42, 0.75)" stroke="#F59E0B" stroke-width="1"/>
    
    <text x="20" y="32" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#FFFFFF">✨ 2972 Verified Leads Generated</text>
    <text x="20" y="55" font-family="system-ui, sans-serif" font-size="11" fill="#CBD5E1">✓ 0% Commission Offers</text>
    <text x="20" y="75" font-family="system-ui, sans-serif" font-size="11" fill="#CBD5E1">✓ Flexible Payment Plans Available</text>
    <text x="20" y="95" font-family="system-ui, sans-serif" font-size="11" fill="#CBD5E1">✓ High Rental Yield Assurance</text>
    <text x="20" y="118" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#F59E0B">CPL: ₹60.5 | Meta &amp; Google Campaign</text>
  </g>

  <!-- CTA Button -->
  <g transform="translate(20, 320)">
    <rect width="260" height="44" rx="22" fill="url(#goldGrad)"/>
    <text x="130" y="27" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#0F172A" text-anchor="middle">Enquire Now →</text>
  </g>

  <!-- Subtext -->
  <text x="150" y="386" font-family="system-ui, sans-serif" font-size="9" fill="#94A3B8" text-anchor="middle">Classic Paramount Real Estate • Verified Projects</text>
</svg>
